<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Tourism System</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Multi-Agent Tourism System</h1>
    <p>Ask about a destination's weather and attractions using natural language.</p>

    <div class="card">
      <label for="query">Your query</label>
      <textarea id="query" rows="3" placeholder="e.g. I'm going to go to Bangalore, what is the temperature there? And what are the places I can visit?"></textarea>
      <button id="send">Send</button>
    </div>

    <div id="result" class="card hidden">
      <h2>Result</h2>
      <div id="message"></div>
      <div id="details"></div>
    </div>

    <footer>
      <small>Powered by Nominatim (OSM), Open‑Meteo, and Overpass API.</small>
    </footer>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
